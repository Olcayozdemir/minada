<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- Taşınabilir güç istasyonu + katlanabilir panel — rooftop/bess stilinde -->
  <g stroke="#8F6110" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <!-- katlanabilir panel (arkada, açık duran iki kanat) -->
    <g>
      <path d="M148 118 L196 96 L210 168 L162 184 Z" fill="#EFBC4F"/>
      <path d="M154 124 L190 107 L200 160 L166 172 Z" fill="#33C3D4" stroke-width="5"/>
      <path d="M196 96 L238 108 L244 176 L210 168 Z" fill="#EFBC4F"/>
      <path d="M202 105 L232 114 L237 166 L208 160 Z" fill="#1E9FB0" stroke-width="5"/>
      <!-- panel destek ayağı -->
      <line x1="216" y1="176" x2="216" y2="198"/>
    </g>
    <!-- istasyon gövdesi -->
    <path d="M40 96 h96 a16 16 0 0 1 16 16 v76 a12 12 0 0 1 -12 12 H36 a12 12 0 0 1 -12 -12 v-76 a16 16 0 0 1 16 -16 z" fill="#EFBC4F"/>
    <!-- sağ gölge -->
    <path d="M120 100 h12 a14 14 0 0 1 14 14 v74 a8 8 0 0 1 -8 8 h-18 z" fill="#DDA53B" stroke="none"/>
    <!-- tutma sapı -->
    <path d="M52 96 v-14 a16 16 0 0 1 16 -16 h40 a16 16 0 0 1 16 16 v14" fill="none"/>
    <!-- ekran -->
    <rect x="40" y="112" width="48" height="30" rx="6" fill="#FFF6E2"/>
    <line x1="48" y1="122" x2="74" y2="122" stroke-width="5"/>
    <line x1="48" y1="132" x2="66" y2="132" stroke-width="5"/>
    <!-- şimşek -->
    <path d="M112 108 L98 128 h9 L102 144 L118 122 h-9 Z" fill="#33C3D4" stroke-width="5"/>
    <!-- prizler -->
    <circle cx="56" cy="168" r="11" fill="#FFFFFF"/>
    <circle cx="88" cy="168" r="11" fill="#FFFFFF"/>
    <circle cx="56" cy="168" r="3" fill="#8F6110" stroke="none"/>
    <circle cx="88" cy="168" r="3" fill="#8F6110" stroke="none"/>
    <!-- ışık şeridi -->
    <line x1="36" y1="192" x2="128" y2="192" stroke="#FFF6E2" stroke-width="6"/>
  </g>
</svg>
