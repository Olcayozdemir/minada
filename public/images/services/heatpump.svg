<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- Hava kaynaklı ısı pompası dış ünitesi — rooftop/bess illüstrasyon stilinde -->
  <g stroke="#8F6110" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <!-- ayaklar -->
    <rect x="52" y="196" width="26" height="16" rx="5" fill="#DDA53B"/>
    <rect x="178" y="196" width="26" height="16" rx="5" fill="#DDA53B"/>
    <!-- gövde -->
    <rect x="28" y="56" width="200" height="144" rx="18" fill="#EFBC4F"/>
    <!-- gövde sağ gölge -->
    <path d="M186 60 h24 a14 14 0 0 1 14 14 v108 a14 14 0 0 1 -14 14 h-24 z" fill="#DDA53B" stroke="none"/>
    <!-- fan çerçevesi -->
    <circle cx="100" cy="128" r="52" fill="#FFF6E2"/>
    <circle cx="100" cy="128" r="38" fill="#FFFFFF"/>
    <!-- fan kanatları -->
    <g fill="#EFBC4F">
      <path d="M100 128 C 92 108, 96 96, 100 92 C 112 100, 114 114, 108 124 Z"/>
      <path d="M100 128 C 120 122, 130 126, 133 132 C 123 142, 109 141, 102 134 Z"/>
      <path d="M100 128 C 88 144, 76 146, 70 144 C 74 130, 86 122, 96 124 Z"/>
    </g>
    <circle cx="100" cy="128" r="9" fill="#33C3D4"/>
    <!-- sağ panel: havalandırma çizgileri -->
    <line x1="176" y1="92" x2="212" y2="92"/>
    <line x1="176" y1="112" x2="212" y2="112"/>
    <line x1="176" y1="132" x2="212" y2="132"/>
    <line x1="176" y1="152" x2="212" y2="152"/>
    <!-- alt borular -->
    <path d="M196 200 v18 M212 200 v18" stroke="#8F6110"/>
    <circle cx="196" cy="222" r="5" fill="#33C3D4" stroke-width="5"/>
    <circle cx="212" cy="222" r="5" fill="#33C3D4" stroke-width="5"/>
  </g>
</svg>
